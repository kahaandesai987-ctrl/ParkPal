<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkPal - Smart Parking Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans h-screen flex flex-col overflow-hidden">
    <!-- Premium App Header -->
    <header class="bg-gradient-to-r from-slate-900 to-emerald-900 text-white p-3 shadow-lg flex justify-between items-center z-20 relative">
        <div class="flex items-center space-x-3">
            <div class="h-10 w-10 bg-slate-800 rounded-full p-0.5 flex items-center justify-center shadow-md overflow-hidden border border-slate-600">
                <img src="logo.png" alt="ParkPal Logo" class="h-full w-full object-cover rounded-full" onerror="this.src='https://via.placeholder.com/40/0f172a/ffffff?text=PP'">
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-wider text-emerald-50">PARK PAL</h1>
                <p class="text-[10px] text-emerald-300 uppercase tracking-widest -mt-1">Smart Parking Assistant</p>
            </div>
        </div>
        <div class="hidden md:flex items-center space-x-4">
            <span class="text-xs bg-white/10 px-3 py-1.5 rounded-full border border-white/20 shadow-sm font-medium">📍 Mumbai West Zone</span>
            <button class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-1.5 rounded-full transition shadow-md font-semibold">Profile</button>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        <!-- Sidebar Controls -->
        <aside class="w-full md:w-[400px] bg-white shadow-2xl z-10 flex flex-col overflow-y-auto border-r border-slate-200">
            <div class="p-5 bg-gradient-to-b from-slate-50 to-white">
                <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Find Your Spot
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Destination</label>
                        <select id="destination" class="w-full p-2.5 border-2 border-slate-300 rounded-lg bg-white text-slate-800 font-bold focus:outline-none focus:border-emerald-500 transition shadow-sm">
                            <option value="mpstme">MPSTME, Vile Parle West</option>
                            <option value="infiniti">Infiniti Mall, Andheri West</option>
                            <option value="dn_nagar">DN Nagar Metro Station</option>
                            <option value="juhu">Juhu Beach</option>
                        </select>
                    </div>
                    
                    <div class="flex space-x-3">
                        <div class="flex-1">
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Vehicle</label>
                            <select id="vehicle-type" class="w-full p-2.5 border border-slate-200 rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 shadow-sm text-sm">
                                <option value="car">Car</option>
                                <option value="bike">Two-Wheeler</option>
                            </select>
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Arrival</label>
                            <input type="time" value="09:00" class="w-full p-2.5 border border-slate-200 rounded-lg bg-white shadow-sm text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">View & Scenarios</label>
                        <select id="scenario-selector" class="w-full p-2.5 border-2 border-emerald-500 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 bg-emerald-50/30 font-medium text-emerald-900 shadow-sm">
                            <option value="nearest">Nearest & Available</option>
                            <option value="view_all">View All Parking Spaces in Area</option>
                            <option value="rainy">Rainy Day (Covered spots only)</option>
                            <option value="budget">Budget-friendly (Sort by price)</option>
                            <option value="full">Closest Spot is Full</option>
                            <option value="no_data">Unverified Street Parking</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="px-5 pb-2 pt-4 bg-slate-100/50 border-t border-slate-200 flex justify-between items-end">
                <h3 id="results-title" class="text-sm font-bold text-slate-800">Best Matches</h3>
                <span class="text-[10px] text-slate-400 font-medium" id="results-subtitle">Ranked by algorithm</span>
            </div>
            
            <div id="recommendations-container" class="flex-1 p-4 space-y-4 overflow-y-auto bg-slate-100/50">
                <!-- Cards injected via JS -->
            </div>
        </aside>

        <!-- Map Area -->
        <div class="flex-1 relative bg-slate-200">
            <div id="map" class="h-full w-full z-0"></div>
            
            <!-- Enhanced Insights Panel -->
            <div class="absolute top-5 right-5 bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-2xl z-[1000] w-64 border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h4 class="text-sm font-bold text-slate-800">Live Insights</h4>
                    <span class="flex h-2.5 w-2.5 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                </div>
                <div class="grid grid-cols-2 gap-3 text-xs mb-3">
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                        <span class="block text-slate-400 font-medium mb-0.5">Occupancy</span>
                        <span id="insight-occupancy" class="font-bold text-xl text-emerald-600">82%</span>
                    </div>
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                        <span class="block text-slate-400 font-medium mb-0.5">Traffic</span>
                        <span id="insight-congestion" class="font-bold text-xl text-orange-500">Mod</span>
                    </div>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-1.5 mb-1">
                    <div id="occupancy-bar" class="bg-emerald-500 h-1.5 rounded-full" style="width: 82%"></div>
                </div>
                <p class="text-[9px] text-slate-400 text-right">Data refreshed just now</p>
            </div>
        </div>
    </main>

    <!-- Hold Spot Modal -->
    <div id="hold-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[2000] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all">
            <div class="bg-emerald-600 p-4 text-center">
                <div class="w-12 h-12 bg-white rounded-full mx-auto flex items-center justify-center mb-2 shadow-inner">
                    <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="text-lg font-bold text-white">Spot Held!</h3>
            </div>
            <div class="p-6 text-center">
                <p class="text-sm text-slate-600 mb-1">Your spot at</p>
                <p id="modal-lot-name" class="font-bold text-slate-800 text-lg mb-4">Lot Name</p>
                
                <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 mb-6">
                    <p class="text-xs text-slate-500 uppercase tracking-wider mb-1">Leave Home By</p>
                    <p class="text-3xl font-black text-slate-800">08:45 AM</p>
                    <p class="text-xs text-orange-600 font-medium mt-2">Hold expires in 15:00</p>
                </div>
                
                <div class="flex space-x-3">
                    <button onclick="document.getElementById('hold-modal').classList.add('hidden')" class="flex-1 py-2.5 border-2 border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 transition">Cancel</button>
                    <a id="modal-nav-btn" href="#" target="_blank" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-lg flex justify-center items-center">Navigate ↗</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
